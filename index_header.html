<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1200, initial-scale=1.0">
    <title>Stat Stackers - Game HUD Header</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Rajdhani', sans-serif;
            background: #0a0a12;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
        }

        .game-hud-container {
            width: 1200px;
            height: 72px;
            background: linear-gradient(180deg, #1a1a2e 0%, #0d0d1a 100%);
            position: relative;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
        }

        /* Corner Decorations - Top Left */
        .corner-tl {
            position: absolute;
            top: 0;
            left: 0;
            width: 60px;
            height: 60px;
            overflow: hidden;
        }

        .corner-tl::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border-top: 3px solid #ffd700;
            border-left: 3px solid #ffd700;
            border-top-left-radius: 8px;
        }

        .corner-tl::after {
            content: '';
            position: absolute;
            top: 8px;
            left: 8px;
            width: 20px;
            height: 20px;
            border-top: 2px solid #00ffcc;
            border-left: 2px solid #00ffcc;
            border-top-left-radius: 4px;
            box-shadow: 0 0 10px #00ffcc44;
        }

        /* Corner Decorations - Top Right */
        .corner-tr {
            position: absolute;
            top: 0;
            right: 0;
            width: 60px;
            height: 60px;
            overflow: hidden;
        }

        .corner-tr::before {
            content: '';
            position: absolute;
            top: 0;
            right: 0;
            width: 100%;
            height: 100%;
            border-top: 3px solid #ffd700;
            border-right: 3px solid #ffd700;
            border-top-right-radius: 8px;
        }

        .corner-tr::after {
            content: '';
            position: absolute;
            top: 8px;
            right: 8px;
            width: 20px;
            height: 20px;
            border-top: 2px solid #00ffcc;
            border-right: 2px solid #00ffcc;
            border-top-right-radius: 4px;
            box-shadow: 0 0 10px #00ffcc44;
        }

        /* Bottom Decorative Line */
        .bottom-line {
            position: absolute;
            bottom: 0;
            left: 20px;
            right: 20px;
            height: 2px;
            background: linear-gradient(90deg,
                transparent 0%,
                #ffd700 10%,
                #00ffcc 30%,
                #00ffcc 70%,
                #ffd700 90%,
                transparent 100%
            );
            box-shadow: 0 0 20px #00ffcc66;
        }

        /* XP/Progress Bar Decoration */
        .xp-bar-container {
            position: absolute;
            bottom: 8px;
            left: 80px;
            right: 80px;
            height: 4px;
            background: #1a1a2e;
            border: 1px solid #333;
            border-radius: 2px;
        }

        .xp-bar {
            width: 35%;
            height: 100%;
            background: linear-gradient(90deg, #00ffcc, #00cc99);
            border-radius: 1px;
            box-shadow: 0 0 10px #00ffcc88;
            position: relative;
            animation: xpGlow 2s ease-in-out infinite;
        }

        @keyframes xpGlow {
            0%, 100% { box-shadow: 0 0 10px #00ffcc88; }
            50% { box-shadow: 0 0 20px #00ffccaa; }
        }

        .xp-bar::after {
            content: '';
            position: absolute;
            right: 0;
            top: -1px;
            width: 8px;
            height: 6px;
            background: #00ffcc;
            border-radius: 0 2px 2px 0;
            animation: xpPulse 1s ease-in-out infinite;
        }

        @keyframes xpPulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        /* Logo Section */
        .logo-section {
            display: flex;
            align-items: center;
            gap: 12px;
            z-index: 10;
        }

        .logo-emblem {
            width: 48px;
            height: 48px;
            position: relative;
        }

        .logo-emblem-bg {
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #1a1a2e 0%, #0d0d1a 100%);
            border: 2px solid #ffd700;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow:
                0 0 15px #ffd70044,
                inset 0 0 15px #ffd70022;
        }

        .logo-emblem-icon {
            font-size: 24px;
            color: #ffd700;
            text-shadow: 0 0 10px #ffd700;
        }

        .logo-stats {
            position: absolute;
            top: -4px;
            right: -4px;
            background: linear-gradient(135deg, #ff4444, #cc0000);
            color: white;
            font-size: 8px;
            font-weight: 700;
            padding: 2px 4px;
            border-radius: 4px;
            border: 1px solid #ff6666;
            box-shadow: 0 0 8px #ff444488;
        }

        .logo-text-container {
            display: flex;
            flex-direction: column;
        }

        .logo-title {
            font-family: 'Cinzel', serif;
            font-size: 22px;
            font-weight: 700;
            color: #ffd700;
            text-shadow:
                0 0 10px #ffd70066,
                0 2px 4px #00000088;
            letter-spacing: 1px;
            line-height: 1;
        }

        .logo-subtitle {
            font-family: 'Rajdhani', sans-serif;
            font-size: 11px;
            font-weight: 600;
            color: #00ffcc;
            text-transform: uppercase;
            letter-spacing: 3px;
            margin-top: 2px;
            text-shadow: 0 0 8px #00ffcc66;
        }

        /* Navigation Section */
        .nav-section {
            display: flex;
            align-items: center;
            gap: 4px;
            z-index: 10;
        }

        .nav-item {
            padding: 8px 18px;
            color: #b8b8c8;
            text-decoration: none;
            font-size: 14px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            position: relative;
            transition: all 0.2s ease;
            background: transparent;
            border: 1px solid transparent;
            clip-path: polygon(8px 0, 100% 0, calc(100% - 8px) 100%, 0 100%);
        }

        .nav-item::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(180deg, #1a1a2e 0%, #0d0d1a 100%);
            border: 1px solid #333;
            clip-path: polygon(8px 0, 100% 0, calc(100% - 8px) 100%, 0 100%);
            z-index: -1;
            opacity: 0;
            transition: opacity 0.2s ease;
        }

        .nav-item:hover {
            color: #ffd700;
            text-shadow: 0 0 10px #ffd70088;
            border-color: #ffd70044;
        }

        .nav-item:hover::before {
            opacity: 1;
            border-color: #ffd70066;
            box-shadow: 0 0 15px #ffd70022;
        }

        .nav-item.active {
            color: #00ffcc;
            text-shadow: 0 0 10px #00ffcc;
            border-color: #00ffcc66;
        }

        .nav-item.active::before {
            opacity: 1;
            border-color: #00ffcc;
            box-shadow: 0 0 15px #00ffcc33;
        }

        .nav-item.active::after {
            content: '';
            position: absolute;
            bottom: -2px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 6px solid transparent;
            border-right: 6px solid transparent;
            border-bottom: 6px solid #00ffcc;
            filter: drop-shadow(0 0 4px #00ffcc);
        }

        /* Discord Special Button */
        .nav-discord {
            background: linear-gradient(135deg, #5865F2 0%, #4752C4 100%);
            color: white !important;
            border: 1px solid #7289da !important;
            margin-left: 8px;
        }

        .nav-discord::before {
            background: linear-gradient(135deg, #5865F2 0%, #4752C4 100%) !important;
            border-color: #7289da !important;
        }

        .nav-discord:hover {
            box-shadow: 0 0 20px #5865F266 !important;
            transform: translateY(-1px);
        }

        .nav-discord svg {
            width: 14px;
            height: 14px;
            margin-right: 6px;
            vertical-align: middle;
        }

        /* CTA Section */
        .cta-section {
            z-index: 10;
        }

        .btn-cta {
            padding: 10px 24px;
            font-family: 'Rajdhani', sans-serif;
            font-size: 14px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: #0a0a12;
            background: linear-gradient(135deg, #ffd700 0%, #ffaa00 100%);
            border: 2px solid #ffd700;
            border-radius: 4px;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            transition: all 0.2s ease;
            clip-path: polygon(10px 0, 100% 0, calc(100% - 10px) 100%, 0 100%);
            box-shadow:
                0 0 20px #ffd70044,
                inset 0 1px 0 rgba(255, 255, 255, 0.3);
        }

        .btn-cta::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.3), transparent);
            transition: left 0.4s ease;
        }

        .btn-cta:hover {
            transform: translateY(-2px);
            box-shadow:
                0 4px 30px #ffd70066,
                inset 0 1px 0 rgba(255, 255, 255, 0.3);
        }

        .btn-cta:hover::before {
            left: 100%;
        }

        /* Floating Particles */
        .particles {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            pointer-events: none;
            overflow: hidden;
        }

        .particle {
            position: absolute;
            width: 2px;
            height: 2px;
            background: #00ffcc;
            border-radius: 50%;
            opacity: 0.6;
            animation: float 4s ease-in-out infinite;
        }

        .particle:nth-child(1) { left: 10%; top: 20%; animation-delay: 0s; }
        .particle:nth-child(2) { left: 25%; top: 60%; animation-delay: 1s; }
        .particle:nth-child(3) { left: 40%; top: 30%; animation-delay: 2s; }
        .particle:nth-child(4) { left: 55%; top: 70%; animation-delay: 0.5s; }
        .particle:nth-child(5) { left: 70%; top: 40%; animation-delay: 1.5s; }
        .particle:nth-child(6) { left: 85%; top: 50%; animation-delay: 2.5s; }

        @keyframes float {
            0%, 100% { transform: translateY(0) scale(1); opacity: 0.6; }
            50% { transform: translateY(-10px) scale(1.5); opacity: 1; }
        }

        /* Skill Icons Decoration */
        .skill-icons {
            position: absolute;
            left: 50%;
            bottom: 16px;
            transform: translateX(-50%);
            display: flex;
            gap: 12px;
        }

        .skill-icon {
            width: 20px;
            height: 20px;
            background: linear-gradient(135deg, #1a1a2e, #0d0d1a);
            border: 1px solid #333;
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 10px;
            color: #666;
        }

        .skill-icon.active {
            border-color: #00ffcc;
            color: #00ffcc;
            box-shadow: 0 0 8px #00ffcc44;
        }
    </style>
</head>

        <div class="corner-tr"></div>

            <div class="xp-bar"></div>

        <!-- Floating Particles -->
        <div class="particles">

            <div class="particle"></div>
            <div class="particle"></div>
            <div class="particle"></div>
            <div class="particle"></div>

        <!-- Logo Section -->
        <div class="logo-section">
            <div class="logo-emblem">
                <div class="logo-emblem-bg">

                <span class="logo-title">Stat Stackers</span>
                <span class="logo-subtitle">Performance Optimization</span>

        <!-- Navigation Section -->

    </header>

    document.removeEventListener("mouseover", handleMouseOver, true);
    document.removeEventListener("mouseout", handleMouseOut, true);
    document.removeEventListener("click", handleClick, true);
    overlay.style.display = "none";
    highlightBox.style.display = "none";
    tagLabel.style.display = "none";
    selectedBox.style.display = "none";
    selectedLabel.style.display = "none";
  }

  // 添加事件监听
  enableHighlight();
  window.addEventListener("message", handleParentMessage);

  // 暴露全局函数供外部调用
  window.__iframeHighlightControl = {
    enable: enableHighlight,
    disable: disableHighlight,
    fullyDisable: fullyDisableHighlight,
    isEnabled: function isEnabled() {
      return highlightEnabled;
    },
    getSelectedElement: function getSelectedElement() {
      return selectedElement;
    },
    updateSelected: updateSelectedHighlight,
    // 通过消息发送开关控制
    sendToggleMessage: function sendToggleMessage(enabled) {
      window.parent.postMessage({
        type: 'iframe-highlight-status',
        enabled: enabled || highlightEnabled,
        source: 'iframe-highlight-injector'
      }, '*');
    }
  };

  // 通知父窗口脚本已加载
  try {
    window.parent.postMessage({
      type: "iframe-highlight-ready",
      data: {
        url: window.location.href,
        userAgent: navigator.userAgent,
        timestamp: Date.now()
      },
      source: "iframe-highlight-injector"
    }, "*");
  } catch (error) {
    console.warn("无法发送就绪消息到父窗口:", error);
  }

  // 清理函数
  window.__iframeHighlightCleanup = function () {
    fullyDisableHighlight();
    window.removeEventListener("message", handleParentMessage);
    if (overlay.parentElement) {
      overlay.parentElement.removeChild(overlay);
    }
    delete window.__iframeHighlightInitialized;
    delete window.__iframeHighlightCleanup;
  };
})();

</script>
</body>
</html>
